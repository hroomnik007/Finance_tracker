services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      # Bind to loopback only — the public entrypoint is nginx (api.pedani.eu)
      - "127.0.0.1:3001:3001"
    volumes:
      # Persist uploaded avatars across container rebuilds
      - uploads_data:/app/uploads
    networks:
      - finance-tracker_default
    external_links:
      - finance-tracker-postgres-1:postgres

networks:
  finance-tracker_default:
    external: true

volumes:
  postgres_data:
  uploads_data:
