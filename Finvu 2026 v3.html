@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes modalIn{from{opacity:0;transform:scale(0.95)}to{opacity:1;transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes glowPulse{0%,100%{opacity:0.5}50%{opacity:1}}
@keyframes sparkle{0%,100%{opacity:0;transform:scale(0)}50%{opacity:1;transform:scale(1)}}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
@keyframes toastIn{from{opacity:0;transform:translateY(20px) scale(0.9)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes toastOut{to{opacity:0;transform:translateY(-10px) scale(0.95)}}
@keyframes flame{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-1px) rotate(2deg)}}
@keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(248,113,113,0.5)}70%{box-shadow:0 0 0 12px rgba(248,113,113,0)}100%{box-shadow:0 0 0 0 rgba(248,113,113,0)}}
@keyframes paletteIn{from{opacity:0;transform:translate(-50%,-50%) scale(0.96)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}
@keyframes ripple{0%{transform:scale(0);opacity:1}100%{transform:scale(4);opacity:0}}

.fu{animation:fadeUp 0.3s ease both}
.su{animation:slideUp 0.3s cubic-bezier(0.32,0.72,0,1)}
.mi{animation:modalIn 0.2s ease both}
.s1{animation-delay:40ms}.s2{animation-delay:80ms}.s3{animation-delay:120ms}
.s4{animation-delay:160ms}.s5{animation-delay:200ms}.s6{animation-delay:240ms}

.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:5px;background:var(--bg4);border:1px solid var(--border2);color:var(--text2);font-size:10.5px;font-family:'DM Mono',monospace;font-weight:500;line-height:1}

// ── Month switcher ─────────────────────────────────────────────────────────
function MonthSwitcher({month,year,onChange}){
  const prev=()=>{ const m=month===1?12:month-1; const y=month===1?year-1:year; onChange(m,y); };
  const next=()=>{ const m=month===12?1:month+1; const y=month===12?year+1:year; onChange(m,y); };
  return(
    <div style={{display:'flex',alignItems:'center',gap:2,background:'var(--bg3)',border:'1px solid var(--border2)',borderRadius:11,padding:3,flexShrink:0}}>
      <button onClick={prev} style={{width:26,height:26,borderRadius:7,border:'none',background:'transparent',color:'var(--text2)',display:'flex',alignItems:'center',justifyContent:'center'}}
        onMouseEnter={e=>e.currentTarget.style.background='var(--bg4)'} onMouseLeave={e=>e.currentTarget.style.background='transparent'}
      >{I.chevLeft}</button>
      <span style={{fontFamily:"'DM Mono',monospace",fontSize:11.5,color:'var(--text)',padding:'0 8px',minWidth:100,textAlign:'center',fontWeight:500}}>
        {MONTHS[month-1]} {year}
      </span>
      <button onClick={next} style={{width:26,height:26,borderRadius:7,border:'none',background:'transparent',color:'var(--text2)',display:'flex',alignItems:'center',justifyContent:'center'}}
        onMouseEnter={e=>e.currentTarget.style.background='var(--bg4)'} onMouseLeave={e=>e.currentTarget.style.background='transparent'}
      >{I.chevRight}</button>
    </div>
  );
}

// ── useCountUp hook ────────────────────────────────────────────────────────
function useCountUp(target,duration=900){
  const [v,setV]=useState(0);
  const startRef=useRef(0);
  const fromRef=useRef(0);
  const rafRef=useRef(null);
  useEffect(()=>{
    fromRef.current=v;
    startRef.current=performance.now();
    cancelAnimationFrame(rafRef.current);
    const tick=(now)=>{
      const t=Math.min(1,(now-startRef.current)/duration);
      const eased=1-Math.pow(1-t,3);
      setV(fromRef.current+(target-fromRef.current)*eased);
      if(t<1) rafRef.current=requestAnimationFrame(tick);
    };
    rafRef.current=requestAnimationFrame(tick);
    return()=>cancelAnimationFrame(rafRef.current);
  // eslint-disable-next-line
  },[target]);
  return v;
}

// ── Toast system ──────────────────────────────────────────────────────────
const ToastCtx = React.createContext(null);
function ToastProvider({children}){
  const [toasts,setToasts] = useState([]);
  const push = (msg,opts={})=>{
    const id=Date.now()+Math.random();
    setToasts(p=>[...p,{id,msg,kind:opts.kind||'info'}]);
    setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),opts.duration||3600);
  };
  return(
    <ToastCtx.Provider value={push}>
      {children}
      <div style={{position:'fixed',top:14,right:14,zIndex:600,display:'flex',flexDirection:'column',gap:8,maxWidth:340,pointerEvents:'none'}}>
        {toasts.map(t=>(
          <div key={t.id} style={{
            background:t.kind==='success'?'rgba(52,211,153,0.95)':t.kind==='error'?'rgba(248,113,113,0.95)':t.kind==='warning'?'rgba(251,191,36,0.95)':'rgba(139,92,246,0.95)',
            color:'white',padding:'11px 14px',borderRadius:11,fontSize:13,fontWeight:500,
            boxShadow:'0 6px 24px rgba(0,0,0,0.35)',
            animation:'toastIn 0.35s cubic-bezier(0.34,1.56,0.64,1) both',

function CommandPalette({open,onClose,onNavigate,onAdd,onToggleTheme,varExpenses,incomes}){
  const [query,setQuery]=useState('');
  const [selIdx,setSelIdx]=useState(0);
  const inpRef=useRef(null);

  useEffect(()=>{
    if(open){ setQuery(''); setSelIdx(0); setTimeout(()=>inpRef.current?.focus(),50); }
  },[open]);

  const actions=[
    {kind:'nav',id:'dashboard',label:'Prehľad',hint:'Dashboard',icon:'📊',action:()=>onNavigate('dashboard')},
    {kind:'nav',id:'income',label:'Príjmy',hint:'Income',icon:'💰',action:()=>onNavigate('income')},
    {kind:'nav',id:'variable-expenses',label:'Variabilné výdavky',hint:'Variable',icon:'🧾',action:()=>onNavigate('variable-expenses')},
    {kind:'nav',id:'fixed-expenses',label:'Fixné výdavky',hint:'Fixed',icon:'🔒',action:()=>onNavigate('fixed-expenses')},
    {kind:'nav',id:'categories',label:'Kategórie',hint:'Categories',icon:'🏷️',action:()=>onNavigate('categories')},
    {kind:'nav',id:'household',label:'Domácnosť',hint:'Household',icon:'🏠',action:()=>onNavigate('household')},

    {kind:'act',id:'add-exp',label:'Pridať výdavok',hint:'New expense',icon:'➕',action:()=>onAdd('expense')},
    {kind:'act',id:'add-inc',label:'Pridať príjem',hint:'New income',icon:'➕',action:()=>onAdd('income')},
    {kind:'act',id:'toggle-theme',label:'Prepnúť tému',hint:'Theme',icon:'🌓',action:onToggleTheme},
  ];

  const q=query.toLowerCase().trim();
  const filteredActions=q ? actions.filter(a=>a.label.toLowerCase().includes(q)||a.hint.toLowerCase().includes(q)) : actions;
  const txnMatches=q.length>=2 ? [...varExpenses,...incomes.map(i=>({...i,note:i.label}))].filter(t=>(t.note||t.label||'').toLowerCase().includes(q)).slice(0,5) : [];

  const allItems=[
    ...filteredActions.map((a,i)=>({...a,_i:i})),
    ...txnMatches.map((t,i)=>({kind:'txn',id:'t-'+t.id,label:t.note||t.label,hint:t.date,icon:t.amount?(t.recurring!==undefined?'💰':'🧾'):'·',action:()=>{onNavigate(t.recurring!==undefined?'income':'variable-expenses');onClose();},amount:t.amount,_i:filteredActions.length+i})),
  ];

  const trigger=(item)=>{ item.action(); onClose(); };

  useEffect(()=>{
    if(!open) return;
    const h=(e)=>{
      if(e.key==='Escape') onClose();
      else if(e.key==='ArrowDown'){e.preventDefault();setSelIdx(i=>Math.min(i+1,allItems.length-1));}
      else if(e.key==='ArrowUp'){e.preventDefault();setSelIdx(i=>Math.max(i-1,0));}
      else if(e.key==='Enter'){e.preventDefault();if(allItems[selIdx])trigger(allItems[selIdx]);}
    };
    window.addEventListener('keydown',h);
    return()=>window.removeEventListener('keydown',h);
  // eslint-disable-next-line
  },[open,allItems,selIdx]);

  if(!open) return null;

  const sectionTitle=(label)=>(
    <div style={{fontSize:9.5,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.1em',color:'var(--text3)',padding:'10px 16px 4px'}}>{label}</div>
  );

  let curSection=null;
  const rows=[];
  allItems.forEach((item,i)=>{
    const section=item.kind==='nav'?'Navigácia':item.kind==='act'?'Akcie':'Transakcie';
    if(section!==curSection){ rows.push(<div key={'s-'+section}>{sectionTitle(section)}</div>); curSection=section; }
    const sel=selIdx===i;
    rows.push(
      <div key={item.id}
        onClick={()=>trigger(item)}
        onMouseEnter={()=>setSelIdx(i)}
        style={{
          display:'flex',alignItems:'center',gap:11,padding:'9px 16px',cursor:'pointer',
          background:sel?'rgba(139,92,246,0.13)':'transparent',
          borderLeft:sel?'2px solid var(--violet)':'2px solid transparent',
          transition:'background 0.08s',
        }}>
        <span style={{fontSize:15,width:22,display:'flex',justifyContent:'center'}}>{item.icon}</span>
        <span style={{flex:1,fontSize:13.5,color:'var(--text)',fontWeight:sel?500:400}}>{item.label}</span>
        {item.amount!==undefined && <span style={{fontFamily:"'DM Mono',monospace",fontSize:12,color:'var(--text3)'}}>{item.amount.toFixed(2)} €</span>}
        <span style={{fontSize:11,color:'var(--text3)',fontFamily:"'DM Mono',monospace"}}>{item.hint}</span>
        {sel && <span className="kbd">↵</span>}
      </div>
    );
  });

  return(
    <div onClick={onClose} style={{position:'fixed',inset:0,background:'rgba(8,6,14,0.65)',backdropFilter:'blur(6px)',zIndex:500,display:'flex',alignItems:'flex-start',justifyContent:'center',paddingTop:'15vh'}}>
      <div onClick={e=>e.stopPropagation()} style={{

        border:'1px solid var(--border2)',borderRadius:16,
        boxShadow:'0 24px 64px rgba(0,0,0,0.55)',overflow:'hidden',
        animation:'paletteIn 0.18s cubic-bezier(0.34,1.1,0.64,1)',
      }}>
        <div style={{display:'flex',alignItems:'center',gap:10,padding:'14px 18px',borderBottom:'1px solid var(--border)'}}>
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--text3)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{flexShrink:0}}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input ref={inpRef} type="text" value={query} onChange={e=>{setQuery(e.target.value);setSelIdx(0);}} placeholder="Hľadať alebo vykonať akciu…"
            style={{flex:1,background:'transparent',border:'none',outline:'none',color:'var(--text)',fontSize:15}}/>
          <span className="kbd">esc</span>

        <div style={{maxHeight:'50vh',overflowY:'auto',padding:'4px 0 8px'}}>

              <p style={{fontSize:24,marginBottom:8}}>🔍</p>
              <p style={{fontSize:13,color:'var(--text3)'}}>Žiadne výsledky pre "{query}"</p>
            </div>
          )}
        </div>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'8px 16px',borderTop:'1px solid var(--border)',background:'var(--bg)',fontSize:11,color:'var(--text3)'}}>
          <div style={{display:'flex',gap:14}}>
            <span style={{display:'flex',alignItems:'center',gap:5}}><span className="kbd">↑↓</span> pohyb</span>
            <span style={{display:'flex',alignItems:'center',gap:5}}><span className="kbd">↵</span> vybrať</span>
          </div>
          <span style={{display:'flex',alignItems:'center',gap:5}}><span className="kbd">⌘K</span> otvoriť</span>
        </div>
      </div>
    </div>
  );
}

// ── SparklineMini ──────────────────────────────────────────────────────────
function SparklineMini({data,color='var(--violet)',width=110,height=24}){
  if(!data||data.length<2) return null;
  const max=Math.max(...data),min=Math.min(...data),range=max-min||1;
  const pts=data.map((v,i)=>{
    const x=(i/(data.length-1))*width;
    const y=height-((v-min)/range)*(height-3)-1.5;
    return `${x},${y}`;
  });
  const line=`M ${pts.join(' L ')}`;
  const area=`M ${pts[0]} L ${pts.join(' L ')} L ${width},${height} L 0,${height} Z`;
  const gid='spm-'+Math.random().toString(36).slice(2,8);
  return(
    <svg width={width} height={height} style={{display:'block'}}>
      <defs>
        <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.28"/>
          <stop offset="100%" stopColor={color} stopOpacity="0"/>
        </linearGradient>
      </defs>
      <path d={area} fill={`url(#${gid})`}/>
      <path d={line} fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

// ── Confetti (canvas, fire-and-forget) ─────────────────────────────────────
function Confetti({fire,onDone}){
  const canvasRef=useRef(null);
  useEffect(()=>{
    if(!fire) return;
    const cnv=canvasRef.current;
    const ctx=cnv.getContext('2d');
    const W=cnv.width=window.innerWidth;
    const H=cnv.height=window.innerHeight;
    const colors=['#8B5CF6','#34d399','#FBBF24','#f87171','#A78BFA','#06B6D4'];
    const particles=Array.from({length:140},()=>({
      x:W/2+(Math.random()-0.5)*40,y:H/3,
      vx:(Math.random()-0.5)*14,
      vy:-Math.random()*16-4,
      g:0.45,
      size:Math.random()*7+3,
      color:colors[Math.floor(Math.random()*colors.length)],
      rot:Math.random()*Math.PI*2,
      vr:(Math.random()-0.5)*0.3,
      life:1,
    }));
    let rafId,frames=0;
    const tick=()=>{
      ctx.clearRect(0,0,W,H);
      particles.forEach(p=>{
        p.vy+=p.g;
        p.x+=p.vx;
        p.y+=p.vy;
        p.rot+=p.vr;
        p.life-=0.005;
        ctx.save();
        ctx.translate(p.x,p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle=p.color;
        ctx.globalAlpha=Math.max(0,p.life);
        ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
        ctx.restore();
      });
      frames++;
      if(frames<180) rafId=requestAnimationFrame(tick);
      else { ctx.clearRect(0,0,W,H); onDone?.(); }
    };
    rafId=requestAnimationFrame(tick);
    return()=>cancelAnimationFrame(rafId);
  },[fire]);
  if(!fire) return null;
  return <canvas ref={canvasRef} style={{position:'fixed',inset:0,pointerEvents:'none',zIndex:700}}/>;
}

// ── ForecastCard ───────────────────────────────────────────────────────────
function ForecastCard({totalIncome,totalExp,dailyAvg,daysInMonth,dayOfMonth}){
  const prediction=dailyAvg*daysInMonth;
  const predictedBalance=totalIncome-prediction;
  const progress=Math.min(dayOfMonth/daysInMonth,1);
  const ringR=32,ringC=2*Math.PI*ringR;
  const isPositive=predictedBalance>=0;
  return(
    <div style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:16,padding:16,position:'relative',overflow:'hidden'}}>
      <div style={{position:'absolute',top:0,right:0,width:80,height:80,background:isPositive?'rgba(52,211,153,0.08)':'rgba(248,113,113,0.08)',filter:'blur(20px)',borderRadius:'50%'}}/>

// ── SwipeableRow (mobile swipe-to-delete) ─────────────────────────────────
function SwipeableRow({children,onDelete}){
  const [dx,setDx]=useState(0);
  const startX=useRef(0);
  const tracking=useRef(false);
  const onStart=(e)=>{
    tracking.current=true;
    startX.current=e.touches?e.touches[0].clientX:e.clientX;
  };
  const onMove=(e)=>{
    if(!tracking.current) return;
    const x=e.touches?e.touches[0].clientX:e.clientX;
    setDx(Math.max(-100,Math.min(0,x-startX.current)));
  };
  const onEnd=()=>{
    tracking.current=false;
    if(dx<-60){ onDelete?.(); setDx(0); }
    else setDx(0);
  };
  return(
    <div style={{position:'relative',overflow:'hidden',borderRadius:14}}>
      <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'flex-end',paddingRight:18,background:'linear-gradient(90deg,transparent,rgba(248,113,113,0.2) 60%,rgba(248,113,113,0.35))',borderRadius:14}}>
        <span style={{color:'var(--red)',fontSize:12,fontWeight:700,opacity:Math.min(Math.abs(dx)/60,1)}}>Vymazať</span>
      </div>
      <div onTouchStart={onStart} onTouchMove={onMove} onTouchEnd={onEnd}
        style={{transform:`translateX(${dx}px)`,transition:tracking.current?'none':'transform 0.25s cubic-bezier(0.4,0,0.2,1)'}}>
        {children}
      </div>
    </div>
  );
}

              color:type===t?(t==='income'?'var(--green)':t==='fixed'?'var(--warning)':t==='category'?'var(--violet)':'var(--red)'):'var(--text3)',
              boxShadow:type===t?'0 1px 4px rgba(0,0,0,0.2)':'none',
            }}>{l}</button>
          ))}
        </div>
        )}

        <div style={{padding:'16px 20px 0',display:'flex',flexDirection:'column',gap:14}}>
          {/* Amount — hidden for category type */}
          {type!=='category' && (
          <div>
            <label style={{display:'block',fontSize:10.5,fontWeight:600,textTransform:'uppercase',letterSpacing:'0.1em',color:'var(--text3)',marginBottom:7}}>Suma</label>
            <div style={{background:'rgba(139,92,246,0.06)',border:'1px solid rgba(139,92,246,0.22)',borderRadius:14,padding:'12px 16px',display:'flex',alignItems:'center',gap:8}}>
              <span style={{fontSize:22,fontWeight:700,color:'var(--violet)',fontFamily:"'DM Mono',monospace"}}>€</span>
              <input type="text" inputMode="decimal" value={amount} onChange={e=>{
                const r=e.target.value.replace(/[^0-9,]/g,'');
                if((r.match(/,/g)||[]).length>1) return;
                setAmount(r);
              }} placeholder="0,00" style={{flex:1,background:'transparent',border:'none',outline:'none',fontSize:30,fontWeight:700,fontFamily:"'DM Mono',monospace",color:'var(--text)',textAlign:'right',minWidth:0}}/>
            </div>
          </div>
          )}

          {/* Category form */}
          {type==='category' && (
            <>
              <div>
                <label style={{display:'block',fontSize:10.5,fontWeight:600,textTransform:'uppercase',letterSpacing:'0.1em',color:'var(--text3)',marginBottom:7}}>Názov kategórie</label>
                <input type="text" value={catName} onChange={e=>setCatName(e.target.value)} placeholder="Napr. Voľný čas" style={inputSt}
                  onFocus={e=>e.currentTarget.style.borderColor='rgba(139,92,246,0.5)'}
                  onBlur={e=>e.currentTarget.style.borderColor='var(--border2)'}
                />
              </div>
              <div>
                <label style={{display:'block',fontSize:10.5,fontWeight:600,textTransform:'uppercase',letterSpacing:'0.1em',color:'var(--text3)',marginBottom:7}}>Ikona</label>
                <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                  {['🛒','🚗','🎬','🍕','💊','👕','🏠','📚','✈️','💪','🎮','☕','🎵','🎁','🧴','🐾'].map(em=>(
                    <button key={em} onClick={()=>setCatIcon(em)} style={{width:38,height:38,borderRadius:10,border:'none',background:catIcon===em?`${catColor}26`:'var(--bg3)',fontSize:18,cursor:'pointer',outline:catIcon===em?`1.5px solid ${catColor}66`:'none',transition:'all 0.12s'}}>{em}</button>
                  ))}
                </div>
              </div>
              <div>
                <label style={{display:'block',fontSize:10.5,fontWeight:600,textTransform:'uppercase',letterSpacing:'0.1em',color:'var(--text3)',marginBottom:7}}>Farba</label>
                <div style={{display:'flex',gap:9,flexWrap:'wrap'}}>
                  {['#8B5CF6','#10B981','#3B82F6','#F59E0B','#EC4899','#06B6D4','#EF4444','#A78BFA'].map(c=>(
                    <button key={c} onClick={()=>setCatColor(c)} style={{width:32,height:32,borderRadius:'50%',background:c,border:'none',cursor:'pointer',transition:'transform 0.15s',transform:catColor===c?'scale(1.12)':'scale(1)',boxShadow:catColor===c?`0 0 0 3px var(--bg2), 0 0 0 5px ${c}`:'none',position:'relative'}}>
                      {catColor===c&&<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3" strokeLinecap="round" style={{position:'absolute',inset:0,margin:'auto'}}><polyline points="20 6 9 17 4 12"/></svg>}
                    </button>
                  ))}
                </div>
              </div>
              <div>
                <label style={{display:'block',fontSize:10.5,fontWeight:600,textTransform:'uppercase',letterSpacing:'0.1em',color:'var(--text3)',marginBottom:7}}>Mesačný limit <span style={{textTransform:'none',fontWeight:400,color:'var(--text3)',letterSpacing:0}}>(voliteľné)</span></label>
                <input type="text" inputMode="decimal" value={catBudget} onChange={e=>{
                  const r=e.target.value.replace(/[^0-9,]/g,'');
                  if((r.match(/,/g)||[]).length>1) return;
                  setCatBudget(r);
                }} placeholder="0,00 €" style={inputSt}
                  onFocus={e=>e.currentTarget.style.borderColor='rgba(139,92,246,0.5)'}
                  onBlur={e=>e.currentTarget.style.borderColor='var(--border2)'}
                />
              </div>
            </>
          )}

          {/* Note / Label — hidden for category */}
          {type!=='category' && (
          <div>
            <label style={{display:'block',fontSize:10.5,fontWeight:600,textTransform:'uppercase',letterSpacing:'0.1em',color:'var(--text3)',marginBottom:7}}>
              {type==='fixed'?'Názov':'Poznámka'}
            </label>
            <input ref={noteRef} type="text" value={type==='fixed'?label:note}
              onChange={e=>type==='fixed'?setLabel(e.target.value):setNote(e.target.value)}
              placeholder={type==='income'?'Napr. Výplata':type==='fixed'?'Napr. Nájomné':'Napr. Lidl nákup'}
              style={inputSt}
              onFocus={e=>{e.currentTarget.style.borderColor='rgba(139,92,246,0.5)';e.currentTarget.style.boxShadow='0 0 0 3px rgba(139,92,246,0.08)';}}
              onBlur={e=>{e.currentTarget.style.borderColor='var(--border2)';e.currentTarget.style.boxShadow='none';}}
            />
          </div>
          )}

          {/* Category (variable expense) */}
          {type==='expense' && (
            <div>
              <label style={{display:'block',fontSize:10.5,fontWeight:600,textTransform:'uppercase',letterSpacing:'0.1em',color:'var(--text3)',marginBottom:7}}>Kategória</label>
              <div style={{display:'flex',gap:7,flexWrap:'wrap'}}>
                {CATS.map(c=>(
                  <button key={c.id} onClick={()=>setCatId(c.id)} style={{
                    display:'inline-flex',alignItems:'center',gap:5,padding:'5px 11px',
                    borderRadius:99,border:'none',fontSize:12.5,fontWeight:500,cursor:'pointer',flexShrink:0,
                    background:catId===c.id?`${c.color}22`:'var(--bg3)',
                    color:catId===c.id?c.color:'var(--text2)',
                    outline:catId===c.id?`1.5px solid ${c.color}55`:'none',
                    transition:'all 0.12s',
                  }}>{c.icon} {c.name}</button>
                ))}
              </div>
            </div>
          )}

          {/* Day of month (fixed) */}
          {isFixed && (
            <div>
              <label style={{display:'block',fontSize:10.5,fontWeight:600,textTransform:'uppercase',letterSpacing:'0.1em',color:'var(--text3)',marginBottom:7}}>Deň v mesiaci</label>
              <input type="number" min="1" max="31" value={day} onChange={e=>setDay(e.target.value)} style={inputSt}
                onFocus={e=>{e.currentTarget.style.borderColor='rgba(139,92,246,0.5)';}}
                onBlur={e=>{e.currentTarget.style.borderColor='var(--border2)';}}
              />
            </div>
          )}

          {/* Date (income + variable) */}
          {!isFixed && type!=='category' && (
            <div>
              <label style={{display:'block',fontSize:10.5,fontWeight:600,textTransform:'uppercase',letterSpacing:'0.1em',color:'var(--text3)',marginBottom:7}}>Dátum</label>
              <input type="date" value={date} onChange={e=>setDate(e.target.value)} style={{...inputSt,colorScheme:'dark'}}
                onFocus={e=>{e.currentTarget.style.borderColor='rgba(139,92,246,0.5)';}}
                onBlur={e=>{e.currentTarget.style.borderColor='var(--border2)';}}
              />
            </div>
          )}

          {/* Recurring (income) */}
          {type==='income' && (
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:12,padding:'12px 14px'}}>
              <span style={{fontSize:14,color:'var(--text)',fontWeight:500}}>Opakujúci príjem</span>
              <button onClick={()=>setRecurring(v=>!v)} style={{width:44,height:24,borderRadius:99,background:recurring?'var(--violet)':'var(--bg4)',border:'none',cursor:'pointer',position:'relative',transition:'background 0.2s',flexShrink:0}}>
                <div style={{position:'absolute',top:3,width:18,height:18,borderRadius:'50%',background:'white',left:recurring?23:3,transition:'left 0.2s',boxShadow:'0 1px 4px rgba(0,0,0,0.3)'}}/>
              </button>
            </div>
          )}

          {/* Actions */}
          <div style={{display:'flex',gap:10,marginTop:4}}>
            <button onClick={onClose} style={{flex:1,height:48,borderRadius:12,border:'1px solid var(--border2)',background:'transparent',color:'var(--text2)',fontSize:14,fontWeight:500,cursor:'pointer'}}>Zrušiť</button>
            <button onClick={handleSave} disabled={type==='category'?!catName.trim():!amount} style={{flex:2,height:48,borderRadius:12,border:'none',cursor:(type==='category'?catName.trim():amount)?'pointer':'not-allowed',
              background:(type==='category'?catName.trim():amount)?'linear-gradient(135deg,#8B5CF6,#6D28D9)':'var(--bg3)',
              color:(type==='category'?catName.trim():amount)?'white':'var(--text3)',fontSize:14,fontWeight:700,
              boxShadow:amount?'0 4px 16px rgba(139,92,246,0.35)':'none',transition:'all 0.2s',
            }}>
              {type==='income'?'Uložiť príjem →':type==='fixed'?'Uložiť fixný výdavok →':type==='category'?'Vytvoriť kategóriu →':'Uložiť výdavok →'}
            </button>
          </div>
        </div>
        </div>
      </div>
    </div>
  );
}

// ── Transaction row ────────────────────────────────────────────────────────
function TxRow({t,compact=false,onDelete}){
  const cat = t.categoryId?getCat(t.categoryId):null;
  const isIncome = t.type==='income';
  const [hover,setHover]=useState(false);
  return(
    <div style={{
      display:'flex',alignItems:'center',gap:12,
      background:hover?'var(--bg3)':'var(--bg2)',
      border:`1px solid ${hover?'var(--border2)':'var(--border)'}`,
      borderRadius:compact?14:16,padding:compact?'10px 12px':'12px 14px',
      transition:'all 0.15s',cursor:'pointer',
    }}
      onMouseEnter={()=>setHover(true)} onMouseLeave={()=>setHover(false)}
    >
      <div style={{width:compact?38:44,height:compact?38:44,borderRadius:compact?10:12,display:'flex',alignItems:'center',justifyContent:'center',fontSize:compact?15:18,flexShrink:0,background:isIncome?'rgba(52,211,153,0.14)':`${cat?.color??'#9D84D4'}22`}}>
        {isIncome?'💰':cat?.icon??'📦'}
      </div>
      <div style={{flex:1,minWidth:0}}>
        <p style={{fontSize:compact?13:14,fontWeight:500,color:'var(--text)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',marginBottom:2}}>{t.note||t.label}</p>
        <p style={{fontSize:11,color:'var(--text3)',fontFamily:"'DM Mono',monospace"}}>{cat&&!isIncome?`${cat.name} · `:''}{t.date}</p>
      </div>
      {hover && onDelete && <button onClick={e=>{e.stopPropagation();onDelete(t.id);}} style={{padding:6,borderRadius:8,border:'none',background:'rgba(248,113,113,0.1)',color:'var(--red)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>{I.trash}</button>}
      <span style={{fontFamily:"'DM Mono',monospace",fontSize:compact?13:14,fontWeight:700,color:isIncome?'var(--green)':'var(--red)',flexShrink:0}}>
        {isIncome?'+':'-'}{fmt(t.amount)}
      </span>
    </div>
  );
}

      <div style={{display:'flex',alignItems:'center',gap:20}}>
        <div style={{display:'flex',flexDirection:'column',gap:7,flex:1,minWidth:0}}>
          {pieData.slice(0,5).map((d,i)=>{
            const isFiltered=donutFilter===d.name;
            return(
              <div key={i} style={{display:'flex',alignItems:'center',gap:7,cursor:'pointer',padding:'3px 6px',borderRadius:7,background:isFiltered?'rgba(139,92,246,0.1)':'transparent',transition:'background 0.15s'}}
                onMouseEnter={()=>setActiveIdx(i)} onMouseLeave={()=>setActiveIdx(null)}
                onClick={()=>setDonutFilter(f=>f===d.name?null:d.name)}>
                <div style={{width:9,height:9,borderRadius:'50%',background:d.color,flexShrink:0}}/>
                <span style={{fontSize:12,color:activeIdx===i||isFiltered?'var(--text)':'var(--text2)',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',fontWeight:activeIdx===i||isFiltered?600:400}}>{d.name}</span>
                <span style={{fontFamily:"'DM Mono',monospace",fontSize:11,color:'var(--text3)'}}>{totalVar>0?Math.round((d.value/totalVar)*100):0}%</span>
              </div>
            );
          })}
          {donutFilter && (
            <button onClick={()=>setDonutFilter(null)} style={{fontSize:11,color:'var(--violet)',background:'rgba(139,92,246,0.1)',border:'1px solid rgba(139,92,246,0.2)',padding:'4px 9px',borderRadius:8,cursor:'pointer',fontFamily:'inherit',marginTop:4,display:'flex',alignItems:'center',gap:5,alignSelf:'flex-start'}}>
              <span>Filter: {donutFilter}</span>
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          )}
        </div>
        <div style={{position:'relative',width:160,height:160,flexShrink:0}}>
          {(() => {
            const cx=80,cy=80,R=68,r=46;
            const total2=pieData.reduce((s,d)=>s+d.value,0)||1;
            let cum=0;
            const slices=pieData.map((d,i)=>{
              const frac=d.value/total2;
              const startA=cum*2*Math.PI-Math.PI/2;
              const endA=(cum+frac)*2*Math.PI-Math.PI/2;
              cum+=frac;
              const x1=cx+R*Math.cos(startA), y1=cy+R*Math.sin(startA);
              const x2=cx+R*Math.cos(endA),   y2=cy+R*Math.sin(endA);
              const ix1=cx+r*Math.cos(startA),iy1=cy+r*Math.sin(startA);
              const ix2=cx+r*Math.cos(endA),  iy2=cy+r*Math.sin(endA);
              const large=frac>0.5?1:0;
              const R2=activeIdx===i?R+5:R;
              const x1a=cx+R2*Math.cos(startA),y1a=cy+R2*Math.sin(startA);
              const x2a=cx+R2*Math.cos(endA),  y2a=cy+R2*Math.sin(endA);
              const path=`M ${ix1} ${iy1} L ${x1a} ${y1a} A ${R2} ${R2} 0 ${large} 1 ${x2a} ${y2a} L ${ix2} ${iy2} A ${r} ${r} 0 ${large} 0 ${ix1} ${iy1} Z`;
              return {path,color:d.color,i};
            });
            return(
              <svg width="160" height="160" viewBox="0 0 160 160">
                {slices.map(s=>(
                  <path key={s.i} d={s.path} fill={s.color}
                    opacity={(donutFilter!==null && donutFilter!==pieData[s.i].name) ? 0.3 : (activeIdx!==null&&activeIdx!==s.i?0.45:1)}
                    style={{cursor:'pointer',transition:'opacity 0.18s'}}
                    onMouseEnter={()=>setActiveIdx(s.i)} onMouseLeave={()=>setActiveIdx(null)}
                    onClick={()=>{ const n=pieData[s.i].name; setDonutFilter(f=>f===n?null:n); }}/>
                ))}
              </svg>
            );
          })()}
          <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',pointerEvents:'none'}}>
            {activeIdx!==null&&pieData[activeIdx]?(
              <><span style={{fontSize:18}}>{pieData[activeIdx].icon}</span>
              <p style={{fontFamily:"'DM Mono',monospace",fontWeight:700,fontSize:12,color:'var(--text)',margin:'3px 0 0',textAlign:'center'}}>{fmt(pieData[activeIdx].value)}</p></>
            ):(
              <><p style={{fontFamily:"'DM Mono',monospace",fontWeight:700,fontSize:13,color:'var(--text)',margin:0}}>{fmtShort(totalVar)}</p>
              <p style={{fontSize:10,color:'var(--text3)',margin:'2px 0 0'}}>celkom</p></>
            )}
          </div>
        </div>
      </div>
    </div>
  );

  const rightPanel=(
    <div style={{display:'flex',flexDirection:'column',gap:12}}>
      {/* Upcoming fixed */}
      <div style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:16,padding:16}}>
        <p style={{fontSize:10,fontWeight:600,textTransform:'uppercase',letterSpacing:'0.08em',color:'var(--text3)',marginBottom:12}}>Nadchádzajúce platby</p>
        {fixedExp.map(fe=>{
          const today=now.getDate();
          let days=fe.dayOfMonth-today;
          if(days<0) days+=daysInMonth;
          return(
            <div key={fe.id} style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
              <div>
                <p style={{fontSize:13,color:'var(--text)',marginBottom:2}}>{fe.label}</p>
                <p style={{fontSize:11,color:'var(--text3)'}}>{days===0?'Dnes':days===1?'Zajtra':`Za ${days} dní`}</p>
              </div>
              <span style={{fontFamily:"'DM Mono',monospace",fontSize:13,fontWeight:600,color:'var(--red)'}}>-{fmt(fe.amount)}</span>
            </div>
          );
        })}
      </div>

      {/* Budgets */}
      <div style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:16,padding:16}}>
        <p style={{fontSize:10,fontWeight:600,textTransform:'uppercase',letterSpacing:'0.08em',color:'var(--text3)',marginBottom:12}}>Rozpočty</p>
        {budgetStatuses.slice(0,4).map(b=>{
          const bc=b.pct>=90?'var(--red)':b.pct>=70?'var(--warning)':'var(--green)';
          return(
            <div key={b.id} style={{marginBottom:12}}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:4}}>
                <span style={{fontSize:12,color:'var(--text)',display:'flex',alignItems:'center',gap:4}}><span>{b.icon}</span>{b.name}</span>
                <span style={{fontSize:12,fontWeight:600,color:bc}}>{b.pct}%</span>
              </div>
              <div style={{height:6,borderRadius:99,background:'var(--bg4)',overflow:'hidden'}}>
                <div style={{height:'100%',borderRadius:99,width:`${Math.min(b.pct,100)}%`,background:bc,transition:'width 0.8s cubic-bezier(0.4,0,0.2,1)'}}/>
              </div>
            </div>
          );
        })}
        <button onClick={()=>onNavigate('categories')} style={{fontSize:12,color:'var(--violet)',background:'rgba(139,92,246,0.08)',border:'1px solid rgba(139,92,246,0.18)',padding:'4px 10px',borderRadius:8,cursor:'pointer',fontFamily:'inherit',fontWeight:500}}>Nastaviť limity →</button>
      </div>

      {/* Recent txns */}
      <div style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:16,padding:16}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
          <p style={{fontSize:10,fontWeight:600,textTransform:'uppercase',letterSpacing:'0.08em',color:'var(--text3)'}}>Posledné transakcie</p>
          <button onClick={()=>onNavigate(activeTab==='income'?'income':'variable-expenses')} style={{fontSize:12,color:'var(--text3)',background:'transparent',border:'none',cursor:'pointer',fontFamily:'inherit',fontWeight:500,transition:'color 0.1s'}}
            onMouseEnter={e=>e.currentTarget.style.color='var(--violet)'} onMouseLeave={e=>e.currentTarget.style.color='var(--text3)'}
          >Všetky →</button>
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:8}}>
          {(activeTab==='income'?last5Inc:last5Exp).map(t=>(
            <div key={t.id} style={{display:'flex',alignItems:'center',gap:8}}>
              <span style={{width:28,height:28,borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,flexShrink:0,background:t.type==='income'?'rgba(52,211,153,0.15)':`${getCat(t.categoryId)?.color??'#9D84D4'}22`}}>
                {t.type==='income'?'💰':getCat(t.categoryId)?.icon??'📦'}
              </span>
              <div style={{flex:1,minWidth:0}}>
                <p style={{fontSize:12,fontWeight:500,color:'var(--text)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',margin:0}}>{t.note||t.label}</p>
                <p style={{fontSize:10,color:'var(--text3)',margin:0,fontFamily:"'DM Mono',monospace"}}>{t.date}</p>
              </div>
              <span style={{fontFamily:"'DM Mono',monospace",fontSize:12,fontWeight:600,color:t.type==='income'?'var(--green)':'var(--red)',flexShrink:0}}>
                {t.type==='income'?'+':'-'}{fmt(t.amount)}
              </span>
            </div>
          ))}
        </div>
      </div>

      {/* Forecast (animated ring) */}
      {totalExp>0&&<ForecastCard totalIncome={totalIncome} totalExp={totalExp} dailyAvg={dailyAvg} daysInMonth={daysInMonth} dayOfMonth={dayOfMonth}/>}
    </div>
  );

  return(
    <div style={{flex:1,overflowY:'auto'}}>
      {/* Mobile */}
      <div className="mb-layout" style={{padding:'20px 20px',display:'flex',flexDirection:'column',gap:16}}>
        {heroCard}
        {areaCharts}
        {pieCard}
        {rightPanel}
      </div>
      {/* Desktop grid */}
      <div className="dt-layout" style={{padding:'24px 22px',display:'none',gap:24,alignItems:'start'}}>
        {/* Left col */}
        <div style={{display:'flex',flexDirection:'column',gap:20,minWidth:0,overflow:'hidden'}}>
          {/* Greeting — editorial style */}
          <div className="fu" style={{display:'flex',alignItems:'flex-end',justifyContent:'space-between',gap:18,paddingBottom:6,borderBottom:'1px solid var(--border)'}}>
            <div style={{display:'flex',alignItems:'center',gap:14,minWidth:0}}>
              <div style={{width:48,height:48,borderRadius:14,background:'linear-gradient(135deg,rgba(139,92,246,0.18),rgba(167,139,250,0.06))',border:'1px solid rgba(139,92,246,0.25)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:22,flexShrink:0}}>{g.emoji}</div>
              <div style={{minWidth:0}}>
                <p style={{fontSize:10.5,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.14em',color:'var(--text3)',marginBottom:3}}>{g.text}</p>
                <p style={{fontSize:26,fontWeight:300,color:'var(--text)',letterSpacing:'-0.6px',lineHeight:1.1}}>Ján, <span style={{fontWeight:500}}>tu sú vaše čísla.</span></p>
              </div>
            </div>
            <div style={{textAlign:'right',flexShrink:0}}>
              <p style={{fontSize:10.5,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.14em',color:'var(--text3)',marginBottom:3}}>Dnes</p>
              <p style={{fontSize:13.5,color:'var(--text2)',fontFamily:"'DM Mono',monospace",letterSpacing:'-0.2px'}}>{todayStr}</p>
            </div>
          </div>
          {heroCard}
          {statCards}
          {areaCharts}
        {pieCard}
        </div>
        {/* Right panel sticky */}
        <div style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:20,padding:'16px 12px',position:'sticky',top:16,alignSelf:'start',overflowY:'auto',maxHeight:'calc(100svh - 90px)',width:280,flexShrink:0}}>
          {rightPanel}
        </div>
      </div>
    </div>
  );
}

// ── Variable Expenses ──────────────────────────────────────────────────────
function VariableExpensesPage({month,year,onMonthChange,expenses,setExpenses}){
  const [filter,setFilter]=useState('all');
  const [search,setSearch]=useState('');
  const [searchFocus,setSearchFocus]=useState(false);
  const sq=search.toLowerCase().trim();
  const baseFiltered=filter==='all'?expenses:expenses.filter(e=>e.categoryId===filter);
  const filtered=sq?baseFiltered.filter(e=>e.note.toLowerCase().includes(sq)||getCat(e.categoryId)?.name.toLowerCase().includes(sq)):baseFiltered;
  const total=filtered.reduce((s,e)=>s+e.amount,0);
  const allTotal=expenses.reduce((s,e)=>s+e.amount,0);
  const anim=useCountUp(total,700);
  const absVal=Math.abs(anim);
  const intPart=Math.floor(absVal).toLocaleString('sk-SK');
  const decPart=Math.round((absVal%1)*100).toString().padStart(2,'0');
  const avg=expenses.length?allTotal/expenses.length:0;
  const biggest=expenses.reduce((m,e)=>(!m||e.amount>m.amount)?e:m,null);

  const grouped=useMemo(()=>{
    const days={};
    filtered.forEach(e=>{ if(!days[e.date]) days[e.date]=[]; days[e.date].push(e); });
    return Object.entries(days).sort((a,b)=>b[0].localeCompare(a[0]));
  },[filtered]);

  return(
    <div style={{flex:1,overflowY:'auto',padding:'20px 22px',display:'flex',flexDirection:'column',gap:18}}>
      {/* Hero — red wallet variant */}
      <div className="fu" style={{
        background:'linear-gradient(135deg,#2a0d10 0%,#5e1a22 45%,#2a0d10 100%)',
        borderRadius:24,padding:'24px 26px 20px',position:'relative',overflow:'hidden',color:'white',
        boxShadow:'0 18px 50px -16px rgba(94,26,34,0.4), 0 0 0 1px rgba(248,113,113,0.2)',
        flexShrink:0,
      }}>
        <div style={{position:'absolute',top:-90,right:-50,width:240,height:240,borderRadius:'50%',background:'radial-gradient(circle,rgba(248,113,113,0.32),transparent 65%)',filter:'blur(40px)',pointerEvents:'none'}}/>
        <div style={{position:'absolute',inset:0,background:'linear-gradient(115deg,transparent 30%,rgba(255,255,255,0.05) 50%,transparent 70%)',pointerEvents:'none'}}/>
        <div style={{position:'absolute',top:22,right:22,width:38,height:38,borderRadius:11,background:'rgba(248,113,113,0.18)',border:'1px solid rgba(248,113,113,0.3)',display:'flex',alignItems:'center',justifyContent:'center'}}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fca5a5" strokeWidth="2" strokeLinecap="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/></svg>
        </div>
        <div style={{position:'relative'}}>
          <div style={{display:'flex',alignItems:'center',gap:7,marginBottom:14}}>
            <span style={{fontSize:11,fontWeight:700,letterSpacing:'0.15em',color:'rgba(255,255,255,0.9)'}}>VARIABILNÉ VÝDAVKY</span>
            <span style={{width:3,height:3,borderRadius:'50%',background:'rgba(255,255,255,0.35)'}}/>
            <span style={{fontSize:11,letterSpacing:'0.05em',color:'rgba(255,255,255,0.55)'}}>{MONTHS[month-1]} {year}</span>
          </div>
          <div style={{display:'flex',alignItems:'baseline',gap:2,marginBottom:16,flexWrap:'wrap'}}>
            <span style={{fontSize:14,fontWeight:500,color:'#fca5a5',marginRight:4}}>−</span>
            <span style={{fontSize:46,fontWeight:300,color:'white',letterSpacing:'-1.8px',lineHeight:1}}>{intPart}</span>
            <span style={{fontSize:22,fontWeight:300,color:'rgba(255,255,255,0.78)',letterSpacing:'-0.4px',marginLeft:1}}>,{decPart}</span>
            <span style={{fontSize:22,fontWeight:400,color:'rgba(255,255,255,0.55)',marginLeft:6}}>€</span>
            <span style={{marginLeft:'auto',fontSize:11,fontWeight:600,padding:'3px 9px',borderRadius:99,background:'rgba(248,113,113,0.18)',color:'#fca5a5',border:'1px solid rgba(248,113,113,0.3)'}}>{expenses.length} transakcií</span>
          </div>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginTop:16,paddingTop:14,borderTop:'1px solid rgba(255,255,255,0.10)'}}>
            <div style={{display:'flex',gap:20,fontSize:11.5,color:'rgba(255,255,255,0.7)'}}>
              <div>Priemer: <span style={{fontFamily:"'DM Mono',monospace",fontWeight:600,color:'white'}}>{fmt(avg)}</span></div>
              <div>Najväčší: <span style={{fontFamily:"'DM Mono',monospace",fontWeight:600,color:'white'}}>{biggest?fmt(biggest.amount):'—'}</span></div>
            </div>
            <MonthSwitcher month={month} year={year} onChange={onMonthChange}/>
          </div>
        </div>
      </div>
      <div style={{display:'flex',alignItems:'center',gap:10,background:'var(--bg2)',border:`1.5px solid ${searchFocus?'var(--violet)':'var(--border)'}`,borderRadius:13,padding:'10px 14px',transition:'all 0.15s',boxShadow:searchFocus?'0 0 0 3px rgba(139,92,246,0.08)':'none'}}>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--text3)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" value={search} onChange={e=>setSearch(e.target.value)} onFocus={()=>setSearchFocus(true)} onBlur={()=>setSearchFocus(false)} placeholder="Hľadať výdavok…"
          style={{flex:1,background:'transparent',border:'none',outline:'none',color:'var(--text)',fontSize:14}}/>
        {search && <button onClick={()=>setSearch('')} style={{padding:3,borderRadius:6,border:'none',background:'var(--bg3)',color:'var(--text3)',cursor:'pointer',display:'flex',alignItems:'center'}}>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>}
        {sq && <span style={{fontSize:11,color:'var(--text3)',fontFamily:"'DM Mono',monospace"}}>{filtered.length} výsl.</span>}
      </div>
      <div style={{display:'flex',gap:7,flexWrap:'wrap'}}>
        {[{id:'all',name:'Všetky',icon:null},...CATS].map(c=>(
          <button key={c.id} onClick={()=>setFilter(c.id)} style={{display:'inline-flex',alignItems:'center',gap:5,padding:'5px 13px',borderRadius:99,fontSize:13,fontWeight:filter===c.id?600:500,cursor:'pointer',background:filter===c.id?'rgba(139,92,246,0.14)':'var(--bg3)',border:`1px solid ${filter===c.id?'rgba(139,92,246,0.28)':'var(--border2)'}`,color:filter===c.id?'var(--violet)':'var(--text2)',transition:'all 0.12s'}}>
            {c.icon&&<span>{c.icon}</span>}{c.name??'Všetky'}
          </button>
        ))}
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:14}}>
        {grouped.map(([date,txns])=>{
          const daySum=txns.reduce((s,t)=>s+t.amount,0);
          const d=new Date(date);
          const dayName=d.toLocaleDateString('sk-SK',{weekday:'long'});
          const dayNum=d.getDate();
          const monthName=d.toLocaleDateString('sk-SK',{month:'long'});
          return(
            <div key={date}>
              <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:8,padding:'4px 2px'}}>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <span style={{fontFamily:"'DM Mono',monospace",fontWeight:700,fontSize:18,color:'var(--text)',lineHeight:1}}>{dayNum}</span>
                  <div>
                    <p style={{fontSize:11.5,color:'var(--text2)',lineHeight:1.1,textTransform:'capitalize'}}>{dayName}</p>
                    <p style={{fontSize:10,color:'var(--text3)',fontFamily:"'DM Mono',monospace"}}>{monthName}</p>
                  </div>
                </div>
                <div style={{flex:1,height:1,background:'var(--border)'}}/>
                <span style={{fontSize:10.5,fontWeight:600,color:'var(--text3)',background:'var(--bg3)',padding:'2px 8px',borderRadius:99}}>{txns.length} tx</span>
                <span style={{fontFamily:"'DM Mono',monospace",fontSize:13,fontWeight:700,color:'var(--red)'}}>−{fmt(daySum)}</span>
              </div>
              <div style={{display:'flex',flexDirection:'column',gap:6}}>
                {txns.map(t=>(
                  <SwipeableRow key={t.id} onDelete={()=>setExpenses(p=>p.filter(e=>e.id!==t.id))}>
                    <TxRow t={{...t,type:'expense'}} onDelete={id=>setExpenses(p=>p.filter(e=>e.id!==id))}/>
                  </SwipeableRow>
                ))}
              </div>
            </div>
          );
        })}
        {filtered.length===0&&(
          <div style={{textAlign:'center',padding:'52px 24px',background:'var(--bg2)',border:'1px dashed var(--border2)',borderRadius:18}}>
            <p style={{fontSize:44,animation:'float 3s ease-in-out infinite',display:'block',marginBottom:12}}>💸</p>
            <p style={{fontSize:16,fontWeight:700,marginBottom:6}}>Žiadne výdavky</p>
            <p style={{fontSize:13,color:'var(--text3)'}}>Skúste iný filter alebo pridajte transakciu.</p>
          </div>
        )}
      </div>
    </div>
  );
}

// ── Fixed Expenses ─────────────────────────────────────────────────────────
function FixedExpensesPage({fixedExp,setFixedExp}){
  const total=fixedExp.reduce((s,f)=>s+f.amount,0);
  const yearly=total*12;
  const anim=useCountUp(total,700);
  const absVal=Math.abs(anim);
  const intPart=Math.floor(absVal).toLocaleString('sk-SK');
  const decPart=Math.round((absVal%1)*100).toString().padStart(2,'0');
  const sorted=[...fixedExp].sort((a,b)=>a.dayOfMonth-b.dayOfMonth);
  const today=new Date().getDate();
  const daysInMonth=new Date(2026,4,0).getDate();

  // Group into Past / Upcoming / Far for timeline view
  const upcoming=sorted.filter(f=>f.dayOfMonth>=today);
  const past=sorted.filter(f=>f.dayOfMonth<today);

  return(
    <div style={{flex:1,overflowY:'auto',padding:'20px 22px',display:'flex',flexDirection:'column',gap:18}}>
      {/* Hero — orange/amber wallet variant */}
      <div className="fu" style={{
        background:'linear-gradient(135deg,#2a1d05 0%,#5d3f10 45%,#2a1d05 100%)',
        borderRadius:24,padding:'24px 26px 20px',position:'relative',overflow:'hidden',color:'white',
        boxShadow:'0 18px 50px -16px rgba(93,63,16,0.4), 0 0 0 1px rgba(251,191,36,0.22)',
        flexShrink:0,
      }}>
        <div style={{position:'absolute',top:-90,right:-50,width:240,height:240,borderRadius:'50%',background:'radial-gradient(circle,rgba(251,191,36,0.32),transparent 65%)',filter:'blur(40px)',pointerEvents:'none'}}/>

// ── Income ─────────────────────────────────────────────────────────────────
function IncomePage({month,year,onMonthChange,incomes,setIncomes}){
  const total=incomes.reduce((s,i)=>s+i.amount,0);
  const recurring=incomes.filter(i=>i.recurring).reduce((s,i)=>s+i.amount,0);
  const oneTime=total-recurring;
  const anim=useCountUp(total,800);
  const absVal=Math.abs(anim);
  const intPart=Math.floor(absVal).toLocaleString('sk-SK');
  const decPart=Math.round((absVal%1)*100).toString().padStart(2,'0');

  // group by source
  const bySource=incomes.reduce((acc,i)=>{ const k=i.source||'Iné'; if(!acc[k])acc[k]={name:k,sum:0,count:0}; acc[k].sum+=i.amount; acc[k].count++; return acc; },{});

        </div>

            <span style={{fontSize:46,fontWeight:300,color:'white',letterSpacing:'-1.8px',lineHeight:1}}>{intPart}</span>
            <span style={{fontSize:22,fontWeight:300,color:'rgba(255,255,255,0.78)',letterSpacing:'-0.4px',marginLeft:1}}>,{decPart}</span>
            <span style={{fontSize:22,fontWeight:400,color:'rgba(255,255,255,0.55)',marginLeft:6}}>€</span>
          </div>
          <div style={{display:'flex',gap:14,fontSize:11.5,color:'rgba(255,255,255,0.7)'}}>

// ── Categories ───────────────────────────────────────────────────────────
function CategoriesPage({varExpenses}){
  const [order,setOrder]=useState(CATS.map(c=>c.id));
  const [dragId,setDragId]=useState(null);
  const [overId,setOverId]=useState(null);
  const [view,setView]=useState('grid');
  const orderedCats=order.map(id=>CATS.find(c=>c.id===id)).filter(Boolean);
  const totalBudget=orderedCats.reduce((s,c)=>s+c.budget,0);
  const totalSpent=orderedCats.reduce((s,c)=>s+(varExpenses.filter(e=>e.categoryId===c.id).reduce((ss,e)=>ss+e.amount,0)),0);
  const overallPct=totalBudget>0?Math.round((totalSpent/totalBudget)*100):0;
  const anim=useCountUp(totalSpent,800);
  const absVal=Math.abs(anim);
  const intPart=Math.floor(absVal).toLocaleString('sk-SK');
  const decPart=Math.round((absVal%1)*100).toString().padStart(2,'0');
  const overBudget=orderedCats.filter(c=>{
    const sp=varExpenses.filter(e=>e.categoryId===c.id).reduce((s,e)=>s+e.amount,0);
    return c.budget>0 && sp>=c.budget*0.9;
  }).length;

  const handleDrop=(targetId)=>{
    if(!dragId||dragId===targetId) return;
    setOrder(prev=>{
      const next=[...prev];
      const from=next.indexOf(dragId);
      const to=next.indexOf(targetId);
      next.splice(from,1);
      next.splice(to,0,dragId);
      return next;
    });
    setDragId(null); setOverId(null);
  };

  return(
    <div style={{flex:1,overflowY:'auto',padding:'20px 22px',display:'flex',flexDirection:'column',gap:18}}>
      {/* Hero — violet wallet variant */}
      <div className="fu" style={{
        background:'linear-gradient(135deg,#1a1235 0%,#3d2a82 45%,#1a1235 100%)',
        borderRadius:24,padding:'24px 26px 20px',position:'relative',overflow:'hidden',color:'white',
        boxShadow:'0 18px 50px -16px rgba(58,42,130,0.4), 0 0 0 1px rgba(139,92,246,0.18)',

              )}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

                <div key={tx.id} style={{display:'flex',alignItems:'center',gap:10}}>

                    <p style={{fontSize:13,fontWeight:500,color:'var(--text)'}}>{tx.label}</p>

        </div>
      </div>
    </div>
  );
}

  const [loading,setLoading]=useState(false);
  const [focused,setFocused]=useState(null);
  const [error,setError]=useState(null);

  const doLogin=()=>{
    if(!email||!pass){setError('Zadajte email a heslo');return;}
    setLoading(true); setError(null);
    setTimeout(()=>{ setLoading(false); onLogin(); },1000);
  };

  const inp=(name)=>({
    width:'100%',background:'var(--bg3)',color:'var(--text)',borderRadius:13,
    padding:'0 16px',height:50,fontSize:15,fontFamily:"'DM Sans',sans-serif",
    border:`1.5px solid ${focused===name?'var(--violet)':'var(--border2)'}`,outline:'none',
    transition:'all 0.2s',boxShadow:focused===name?'0 0 0 3px rgba(139,92,246,0.1)':'none',
  });

  return(
    <div style={{minHeight:'100svh',display:'flex',alignItems:'center',justifyContent:'center',padding:24,background:'var(--bg)',position:'relative',overflow:'hidden'}}>
      <div style={{position:'absolute',top:'15%',left:'50%',transform:'translateX(-50%)',width:500,height:500,borderRadius:'50%',background:'radial-gradient(circle,rgba(139,92,246,0.12) 0%,transparent 70%)',pointerEvents:'none'}}/>
      <div style={{width:'100%',maxWidth:400,display:'flex',flexDirection:'column',gap:24,position:'relative'}}>
        <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:14,animation:'fadeUp 0.4s ease both'}}>
          <Logo size={72}/>
          <div style={{textAlign:'center'}}>
            <h1 style={{fontSize:28,fontWeight:700,letterSpacing:'-0.03em',color:'var(--text)',lineHeight:1}}>Finvu</h1>
            <p style={{fontSize:12,marginTop:5,color:'var(--text3)',fontFamily:"'DM Mono',monospace",letterSpacing:'0.04em'}}>FINANCIE POD KONTROLOU</p>
          </div>
        </div>
        <div className="fu" style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:24,padding:26,boxShadow:'var(--shadow-elevated)',display:'flex',flexDirection:'column',gap:18}}>
          {error&&<div style={{borderRadius:11,padding:'10px 14px',fontSize:13,background:'rgba(248,113,113,0.12)',color:'var(--red)',border:'1px solid rgba(248,113,113,0.3)'}}>{error}</div>}
          <div style={{display:'flex',flexDirection:'column',gap:6}}>
            <label style={{fontSize:10.5,fontWeight:600,textTransform:'uppercase',letterSpacing:'0.12em',color:'var(--text3)'}}>Email</label>
            <input type="email" value={email} onChange={e=>setEmail(e.target.value)} onFocus={()=>setFocused('email')} onBlur={()=>setFocused(null)} onKeyDown={e=>e.key==='Enter'&&doLogin()} style={inp('email')}/>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:6}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
              <label style={{fontSize:10.5,fontWeight:600,textTransform:'uppercase',letterSpacing:'0.12em',color:'var(--text3)'}}>Heslo</label>
              <button style={{fontSize:12,color:'var(--violet)',background:'none',border:'none',cursor:'pointer'}}>Zabudnuté heslo?</button>
            </div>
            <input type="password" value={pass} onChange={e=>setPass(e.target.value)} placeholder="••••••••" onFocus={()=>setFocused('pass')} onBlur={()=>setFocused(null)} onKeyDown={e=>e.key==='Enter'&&doLogin()} style={inp('pass')}/>
          </div>
          <button onClick={doLogin} disabled={loading} style={{height:50,width:'100%',background:'linear-gradient(135deg,#8B5CF6 0%,#6D28D9 100%)',color:'white',border:'none',borderRadius:14,fontSize:15,fontWeight:700,cursor:'pointer',boxShadow:loading?'none':'0 4px 20px rgba(139,92,246,0.4)',opacity:loading?0.75:1,transition:'all 0.2s',display:'flex',alignItems:'center',justifyContent:'center',gap:8}}>
            {loading?<><div style={{width:18,height:18,borderRadius:'50%',border:'2px solid rgba(255,255,255,0.3)',borderTop:'2px solid white',animation:'spin 0.7s linear infinite'}}/>Prihlasovanie...</>:'Prihlásiť sa →'}
          </button>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <div style={{flex:1,height:1,background:'var(--border)'}}/>
            <span style={{fontSize:11,color:'var(--text3)'}}>alebo</span>
            <div style={{flex:1,height:1,background:'var(--border)'}}/>
          </div>
          <button style={{height:46,width:'100%',background:'var(--bg3)',border:'1px solid var(--border2)',borderRadius:14,fontSize:14,fontWeight:500,cursor:'pointer',color:'var(--text)',display:'flex',alignItems:'center',justifyContent:'center',gap:9,transition:'background 0.15s'}}
            onMouseEnter={e=>e.currentTarget.style.background='var(--bg4)'}
            onMouseLeave={e=>e.currentTarget.style.background='var(--bg3)'}
          >
            <svg width="17" height="17" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.259h2.908C16.658 14.213 17.64 11.905 17.64 9.2z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
            Pokračovať cez Google
          </button>
          <p style={{textAlign:'center',fontSize:13,color:'var(--text3)'}}>Nemáte účet? <button style={{color:'var(--violet)',background:'none',border:'none',cursor:'pointer',fontWeight:600}}>Registrovať sa →</button></p>
        </div>
      </div>
    </div>
  );
}

// ── App Shell ──────────────────────────────────────────────────────────────
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "light",
  "accentColor": "#8B5CF6",
  "sidebarCollapsed": false
}/*EDITMODE-END*/;

function AppShell(){
  return (
    <ToastProvider>
      <App/>
    </ToastProvider>
  );
}

function App(){
  const toast=useToast();
  const [paletteOpen,setPaletteOpen]=useState(false);
  const [loggedIn,setLoggedIn]=useState(false);
  const [page,setPage]=useState('dashboard');
  const [collapsed,setCollapsed]=useState(false);
  const [theme,setTheme]=useState(()=>{
    try{const t=JSON.parse(localStorage.getItem('__tweaks_v1')||'{}'); return t.theme||TWEAK_DEFAULTS.theme||'dark';}catch{return 'dark';}
  });
  const [month,setMonth]=useState(4);
  const [year,setYear]=useState(2026);
  const [isDesktop,setIsDesktop]=useState(window.innerWidth>=1024);
  const [showAdd,setShowAdd]=useState(false);
  const [showProfile,setShowProfile]=useState(false);
  const [varExpenses,setVarExpenses]=useState(VAR_EXPENSES);
  const [fixedExp,setFixedExp]=useState(FIXED_EXP);
  const [incomes,setIncomes]=useState(INCOMES);
  const [extraCats,setExtraCats]=useState([]);
  const [dashView,setDashView]=useState('family');
  const [confetti,setConfetti]=useState(false);
  const [notifications,setNotifications]=useState([
    {id:1,icon:'⚠️',color:'#FBBF24',title:'Blížite sa k limitu Zábava',body:'Tento mesiac ste minuli 76 € z 80 € mesačného limitu (95 %).',time:'Pred 2 h',amount:'76,00 / 80,00 €',read:false,target:'categories'},
    {id:2,icon:'🏠',color:'#8B5CF6',title:'Nájomné sa strháva zajtra',body:'1. mája sa odpočíta 650 € — skontrolujte zostatok pred polnocou.',time:'Dnes 09:14',amount:'−650,00 €',read:false,target:'fixed-expenses'},
    {id:3,icon:'🎯',color:'#A78BFA',title:'Cieľ „Nový notebook" je takmer hotový',body:'97 % naplnené — chcete vložiť posledných 50 € a uzavrieť cieľ?',time:'Včera',read:false,target:'savings'},
    {id:4,icon:'💰',color:'#34d399',title:'Výplata bola pripísaná',body:'Zamestnávateľ poslal mesačnú výplatu na hlavný účet.',time:'30. apr',amount:'+1 250,00 €',read:true,target:'income'},
    {id:5,icon:'🔥',color:'#FB923C',title:'7-dňový streak!',body:'Sledujete výdavky 7 dní v rade — udržujte si tempo do konca mája.',time:'28. apr',read:true,target:'dashboard'},
  ]);

  const user={name:'Ján Novák',avatarUrl:null,household_enabled:true};

  useEffect(()=>{ document.documentElement.setAttribute('data-theme',theme); },[theme]);
  useEffect(()=>{ const h=()=>setIsDesktop(window.innerWidth>=1024); window.addEventListener('resize',h); return()=>window.removeEventListener('resize',h); },[]);
  useEffect(()=>{
    const h=(e)=>{
      if((e.metaKey||e.ctrlKey)&&e.key==='k'){ e.preventDefault(); setPaletteOpen(p=>!p); }
    };
    window.addEventListener('keydown',h);
    return()=>window.removeEventListener('keydown',h);
  },[]);

  const toggleTheme=()=>{ const n=theme==='dark'?'light':'dark'; setTheme(n); try{const t=JSON.parse(localStorage.getItem('__tweaks_v1')||'{}');t.theme=n;localStorage.setItem('__tweaks_v1',JSON.stringify(t));}catch{} };

  const handleSave=(t)=>{
    const id=String(Date.now());
    if(t.type==='income'){
      setIncomes(p=>[{id,label:t.label||t.note,date:t.date,amount:t.amount,recurring:t.recurring},...p]);
      toast?.(`Príjem +${t.amount.toFixed(2)} € pridaný`,{kind:'success'});
      if(t.amount>=500){ setConfetti(true); toast?.('🎉 Skvelý príjem! Pokračujte v dobrom tempe.',{kind:'success',duration:5000}); }
    } else if(t.type==='fixed'){
      setFixedExp(p=>[{id,label:t.label,amount:t.amount,dayOfMonth:t.dayOfMonth||1},...p]);
      toast?.(`Fixný výdavok "${t.label}" pridaný`,{kind:'success'});
    } else if(t.type==='category'){
      const newCat={id,name:t.name,icon:t.icon,color:t.color,budget:t.budget||0,spent:0};
      setExtraCats(p=>[...p,newCat]);
      CATS.push(newCat);
      toast?.(`Kategória "${t.name}" vytvorená`,{kind:'success'});
    } else {
      setVarExpenses(p=>[{id,note:t.note,date:t.date,amount:t.amount,categoryId:t.categoryId},...p]);
      const cat=CATS.find(c=>c.id===t.categoryId);
      const spent=VAR_EXPENSES.filter(e=>e.categoryId===t.categoryId).reduce((s,e)=>s+e.amount,0)+t.amount;
      if(cat && cat.budget>0 && spent/cat.budget>=0.9){
        toast?.(`⚠️ Blížite sa k limitu kategórie ${cat.name}`,{kind:'warning'});
      } else {
        toast?.(`Výdavok -${t.amount.toFixed(2)} € pridaný`,{kind:'success'});
      }
    }
  };

  if(!loggedIn) return <LoginPage onLogin={()=>setLoggedIn(true)}/>;

  const renderPage=()=>{
    const mp={month,year,onMonthChange:(m,y)=>{setMonth(m);setYear(y);}};
    switch(page){
      case 'dashboard': return <Dashboard {...mp} onNavigate={setPage} varExpenses={varExpenses} incomes={incomes} fixedExp={fixedExp} dashView={dashView}/>;
      case 'income': return <IncomePage {...mp} incomes={incomes} setIncomes={setIncomes}/>;
      case 'variable-expenses': return <VariableExpensesPage {...mp} expenses={varExpenses} setExpenses={setVarExpenses}/>;
      case 'fixed-expenses': return <FixedExpensesPage fixedExp={fixedExp} setFixedExp={setFixedExp}/>;
      case 'categories': return <CategoriesPage varExpenses={varExpenses}/>;
      case 'household': return <HouseholdPage incomes={incomes} varExpenses={varExpenses}/>;
      case 'savings': return <SavingsPage totalIncome={incomes.reduce((s,i)=>s+i.amount,0)}/>;
      case 'settings': return <SettingsPage theme={theme} onToggleTheme={toggleTheme}/>;
      default: return <Dashboard {...mp} onNavigate={setPage} varExpenses={varExpenses} incomes={incomes} fixedExp={fixedExp} dashView={dashView}/>;
    }
  };

  return(
    <div style={{display:'flex',height:'100svh',width:'100vw',overflow:'hidden',background:'var(--bg)'}}>
      {isDesktop&&<AppNav page={page} setPage={setPage} collapsed={collapsed} onToggle={()=>setCollapsed(c=>!c)} onOpenProfile={()=>setShowProfile(true)} user={user}/>}
      {isDesktop&&<div style={{width:12,flexShrink:0,background:'var(--bg)'}}/>}
      <main style={{flex:1,minWidth:0,display:'flex',flexDirection:'column',overflow:'hidden'}}>
        <Topbar page={page} month={month} year={year} onMonthChange={(m,y)=>{setMonth(m);setYear(y);}} theme={theme} onToggleTheme={toggleTheme} onOpenProfile={()=>setShowProfile(true)} onOpenAdd={()=>setShowAdd(true)} onOpenPalette={()=>setPaletteOpen(true)} user={user} dashView={dashView} onDashViewChange={setDashView} notifications={notifications} setNotifications={setNotifications} onNavigate={setPage}/>
        <div style={{flex:1,overflow:'hidden',display:'flex',flexDirection:'column'}}>
          {renderPage()}
        </div>
        {!isDesktop&&<div style={{height:72}}/>}
      </main>
      {!isDesktop&&<BottomNav page={page} setPage={setPage}/>}
      {showAdd&&<AddModal page={page} onClose={()=>setShowAdd(false)} onSave={handleSave}/>}
      <Confetti fire={confetti} onDone={()=>setConfetti(false)}/>
      {showProfile&&<ProfileModal user={user} onClose={()=>setShowProfile(false)} onLogout={()=>{setShowProfile(false);setLoggedIn(false);}}/>}
      <CommandPalette
        open={paletteOpen}
        onClose={()=>setPaletteOpen(false)}
        onNavigate={(p)=>{setPage(p);setPaletteOpen(false);}}
        onAdd={(t)=>{setShowAdd(true);setPaletteOpen(false);}}
        onToggleTheme={()=>{toggleTheme();setPaletteOpen(false);}}
        varExpenses={varExpenses}
        incomes={incomes}
      />

      <style>{`
        @media(min-width:1024px){
          .dt-only{display:flex!important}
          .mb-only{display:none!important}
          .dt-layout{display:grid!important;grid-template-columns:minmax(0,1fr) 280px}
          .mb-layout{display:none!important}
          .stat-grid{display:grid!important}
        }
        @media(max-width:1023px){
          .dt-only{display:none!important}
          .mb-only{display:flex!important}
          .dt-layout{display:none!important}
          .mb-layout{display:flex!important}
          .stat-grid{grid-template-columns:1fr!important}
          .goal-detail{grid-template-columns:1fr!important}
          .settings-grid{grid-template-columns:1fr!important}
        }
        @keyframes glowPulse{0%,100%{opacity:0.5}50%{opacity:1}}
        @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
        @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        @keyframes spin{to{transform:rotate(360deg)}}
      `}</style>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<AppShell/>);
</script>
</body>
</html>
