<!DOCTYPE html>
<html lang="sk"><head><meta charset="UTF-8"><title>Finvu — Avatar picker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07060B; --hi:#F5F3FF; --lo:#A79FC9; --faint:#5B5578;
  --violet:#8B5CF6; --fuchsia:#EC4899; --cyan:#22D3EE;
  --emerald:#34D399; --rose:#FB7185; --amber:#FBBF24;
  --glass:rgba(255,255,255,.06); --gline:rgba(255,255,255,.12);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#000;display:flex;justify-content:center;padding:40px 16px;font-family:'Manrope',sans-serif;}
.frame{width:390px;background:var(--bg);border-radius:42px;border:8px solid #000;padding:24px 20px;}
.label{font-size:11px;color:var(--lo);text-transform:uppercase;font-weight:700;letter-spacing:.05em;margin-bottom:14px;}
.avatarrow{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 8px;}
.avopt{position:relative;width:56px;height:56px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden;border:2px solid transparent;}
.avopt.on{border-color:var(--hi);box-shadow:0 0 0 3px rgba(139,92,246,.25);}
.blob{position:absolute;border-radius:50%;filter:blur(14px);}
.letter{position:relative;z-index:2;font-family:'Outfit';font-weight:800;font-size:20px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.25);}

.a1{background:#1a1625;} .a1 .blob.x1{width:50px;height:50px;background:var(--violet);top:-10px;left:-10px;} .a1 .blob.x2{width:40px;height:40px;background:var(--fuchsia);bottom:-14px;right:-10px;}
.a2{background:#0f2620;} .a2 .blob.x1{width:50px;height:50px;background:var(--emerald);top:-12px;right:-8px;} .a2 .blob.x2{width:36px;height:36px;background:var(--cyan);bottom:-10px;left:-8px;}
.a3{background:#2e1620;} .a3 .blob.x1{width:48px;height:48px;background:var(--rose);top:-8px;left:-14px;} .a3 .blob.x2{width:38px;height:38px;background:var(--amber);bottom:-12px;right:-6px;}
.a4{background:#1c1a2e;} .a4 .blob.x1{width:52px;height:52px;background:var(--cyan);bottom:-14px;left:-10px;} .a4 .blob.x2{width:34px;height:34px;background:var(--violet);top:-8px;right:-8px;}
.a5{background:#231a10;} .a5 .blob.x1{width:50px;height:50px;background:var(--amber);top:-10px;left:-6px;} .a5 .blob.x2{width:36px;height:36px;background:var(--rose);bottom:-10px;right:-12px;}

.uploadopt{width:56px;height:56px;border-radius:50%;border:1.5px dashed var(--gline);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--lo);}
</style></head>
<body>
<div class="frame">
  <div class="label">Vyber avatar</div>
  <div class="avatarrow">
    <div class="avopt on a1"><div class="blob x1"></div><div class="blob x2"></div><div class="letter">P</div></div>
    <div class="avopt a2"><div class="blob x1"></div><div class="blob x2"></div><div class="letter">P</div></div>
    <div class="avopt a3"><div class="blob x1"></div><div class="blob x2"></div><div class="letter">P</div></div>
    <div class="avopt a4"><div class="blob x1"></div><div class="blob x2"></div><div class="letter">P</div></div>
    <div class="avopt a5"><div class="blob x1"></div><div class="blob x2"></div><div class="letter">P</div></div>
    <div class="uploadopt"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg></div>
  </div>
</div>
</body></html>
